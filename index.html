<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dépenses">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mes Dépenses</title>
<style>
:root{--bleu:#0284c7;--violet:#7c3aed;--vert:#0d9488;--rouge:#dc2626;--orange:#f97316;--bg:#f4f7fb;--card:#fff;--txt:#0f172a;--mut:#64748b;--line:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--txt:#e5edf8;--mut:#94a3b8;--line:#243049}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--bleu),var(--violet));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 54px}
header h1{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
header small{opacity:.85}
main{padding:0 14px;margin-top:-38px;max-width:760px;margin-left:auto;margin-right:auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 18px rgba(15,23,42,.08);border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line);border-left:5px solid var(--c);box-shadow:0 4px 14px rgba(15,23,42,.06)}
.kpi span{display:block;font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-size:1.25rem;font-weight:800}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
input,select,button,textarea{font:inherit;color:var(--txt)}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:linear-gradient(135deg,var(--bleu),var(--violet));color:#fff;cursor:pointer}
button.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
button.del{background:none;color:var(--rouge);padding:4px 8px}
.op{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.op:last-child{border:0}
.op .m{flex:1;min-width:0}.op .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.op .m small{color:var(--mut)}
.pos{color:var(--vert);font-weight:800}.neg{color:var(--rouge);font-weight:800}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.82rem}
.bar i{display:block;height:10px;border-radius:6px;background:var(--c)}
.bar .t{width:120px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .v{margin-left:auto;font-weight:700}
/* Onglets façon dashboard PEA : barre plate défilante, onglet actif teinté + trait dégradé */
nav{position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:9;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding:4px 6px 0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(15,23,42,.08)}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;height:42px;padding:0 14px;background:none;color:var(--mut);font-size:.88rem;font-weight:600;white-space:nowrap;border-radius:10px 10px 0 0;position:relative;transition:color .15s,background-color .15s}
nav button:hover{background:color-mix(in srgb,var(--bleu) 8%,transparent);color:var(--bleu)}
nav button.on{background:color-mix(in srgb,var(--bleu) 10%,transparent);color:var(--bleu)}
nav button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--bleu),var(--violet))}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;font-size:1.8rem;padding:0;z-index:10;box-shadow:0 8px 22px rgba(124,58,237,.4)}
dialog{border:0;border-radius:18px;padding:16px;width:min(94vw,440px);background:var(--card);color:var(--txt)}
dialog::backdrop{background:rgba(15,23,42,.5)}
label{font-size:.75rem;color:var(--mut);font-weight:600;display:block;margin:8px 0 3px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.empty{text-align:center;color:var(--mut);padding:20px 0}
.hide{display:none}
.ch{display:flex;align-items:flex-start;user-select:none;-webkit-user-select:none}
.ch .yax{flex:none}
.sc{flex:1;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.sc svg{display:block}
.sc.fit svg{touch-action:pan-y}
.hz{fill:transparent;cursor:pointer}
.hz:hover,.hz.act{fill:rgba(127,127,127,.16)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.72rem;color:var(--mut);margin-top:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg i.ds{height:0;width:14px;border-radius:0;border-top:2px dashed #64748b;vertical-align:3px}
.bar[data-tip]{cursor:pointer;padding:3px 4px;border-radius:8px}
.bar.act{background:rgba(127,127,127,.12)}
#tip{position:fixed;display:none;z-index:60;pointer-events:none;max-width:250px;background:#0f172a;color:#fff;border-radius:10px;padding:8px 11px;font-size:.76rem;line-height:1.4;box-shadow:0 8px 24px rgba(15,23,42,.35)}
#tip .tt{font-weight:800;margin-bottom:3px}
#tip .tl{display:flex;justify-content:space-between;gap:14px}
#tip .tc{margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.18);color:#cbd5e1}
.hm{display:grid;grid-template-columns:30px repeat(12,minmax(0,1fr));gap:3px;font-size:.56rem;align-items:center}
.hm .hh{text-align:center;color:var(--mut);font-weight:600}
.hm .hy{color:var(--mut);font-weight:700;font-size:.62rem}
.hc{height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.hc.off{background:rgba(127,127,127,.08);cursor:default}
.hc.act{outline:2px solid var(--bleu)}
.hl{display:flex;align-items:center;gap:8px;font-size:.68rem;color:var(--mut);margin-top:8px}
.hl i{flex:1;height:8px;border-radius:6px;background:linear-gradient(90deg,rgba(220,38,38,.1),rgba(220,38,38,.95))}
.op .r{text-align:right}
.d{font-size:.68rem;color:var(--mut);margin-top:2px}
.d span{font-weight:700}
</style>
</head>
<body>
<header><h1>💶 Mes Dépenses</h1><small id="sub">Hors connexion</small></header>
<main><nav id="nav"></nav><div id="app"></div></main>
<button class="fab" id="fab" aria-label="Ajouter">+</button>

<dialog id="dlg"><form method="dialog" id="frm">
 <h3 style="margin:0 0 4px">Nouvelle opération</h3>
 <div class="seg" style="margin-top:8px"><button type="button" class="sec" data-sens="Dépense" id="sD">Dépense</button><button type="button" class="sec" data-sens="Revenu" id="sR">Revenu</button></div>
 <label>Libellé</label><input id="fLib" required autocomplete="off" list="libs">
 <datalist id="libs"></datalist>
 <label>Montant (€)</label><input id="fMt" type="number" step="0.01" inputmode="decimal" required>
 <label>Catégorie</label><select id="fCat"></select>
 <label>Date</label><input id="fDate" type="date" required>
 <div class="row" style="margin-top:14px"><button type="button" class="sec" id="fCancel" style="flex:1">Annuler</button><button type="submit" style="flex:2">Enregistrer</button></div>
</form></dialog>

<dialog id="dlgS"><form method="dialog" id="frmS">
 <h3 style="margin:0 0 4px">Nouveau salaire perçu</h3>
 <label>Date de versement</label><input id="sDate" type="date" required>
 <label>Employeur</label><input id="sEmp" autocomplete="off" list="emps"><datalist id="emps"></datalist>
 <label>Type</label><select id="sType"><option>Salaire</option><option>Prime</option><option>13e mois</option><option>Indemnités</option><option>Autre</option></select>
 <label>Montant net perçu (€)</label><input id="sNet" type="number" step="0.01" inputmode="decimal" required>
 <label>Montant brut (€) — facultatif</label><input id="sBrut" type="number" step="0.01" inputmode="decimal">
 <div class="row" style="margin-top:14px"><button type="button" class="sec" id="sCancel" style="flex:1">Annuler</button><button type="submit" style="flex:2">Enregistrer</button></div>
</form></dialog>

<input type="file" id="file" accept=".json,.xml,.xlsx,.xlsm" multiple class="hide">
<script>
"use strict";
const CATS=["Salaire","Prime / Remboursement","Virement reçu","Logement","Énergie & Charges","Assurances","Courses & Nourriture","Restaurants & Sorties","Transport & Carburant","Voiture (entretien/assurance)","Santé","Vêtements & Shopping","Loisirs & Abonnements","Voyages","Cadeaux","Impôts","Crédit","Frais bancaires","Retrait espèces","Virement émis","Divers"];
const REV=["Salaire","Prime / Remboursement","Virement reçu"];
const PAL=["#0284c7","#7c3aed","#0d9488","#f97316","#dc2626","#ca8a04","#db2777","#4f46e5","#059669","#ea580c","#0891b2","#9333ea"];
const SEC={depenses:["Depenses","Depense"],recurrentes:["Recurrentes","Recurrente"],salaires:["Salaires","Salaire"],prets:["Prets","Pret"]};
const NUM=new Set(["montant","net","brut","capital","taux","duree","assurance","premiere_reelle"]);
const KEY="depenses_v1";
let D=load(),tab="home",per="m:"+TODAY().slice(0,7),gran="jour",q="",sens="Dépense";
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.depenses)return r}catch(e){}return{version:1,depenses:[],recurrentes:[],salaires:[],prets:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){alert("Stockage impossible")}}
const $=s=>document.querySelector(s);
const eur=n=>(n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur2=n=>(n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isRev=o=>o.sens?o.sens==="Revenu":REV.includes(o.categorie);
const fdate=d=>d?new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short"}):"";
const mlabel=m=>new Date(m+"-01T00:00:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"});

function bars(map,col,tf){const e=Object.entries(map).sort((a,b)=>b[1]-a[1]);if(!e.length)return'<div class="empty">Aucune donnée</div>';const mx=e[0][1]||1;
 return e.map(([k,v],i)=>`<div class="bar" style="--c:${col||PAL[i%PAL.length]}"${tf?` data-tip="${esc(tf(k,v))}"`:""}><span class="t">${esc(k)}</span><i style="width:${Math.max(3,v/mx*100*.45)}%"></i><span class="v">${eur(v)}</span></div>`).join("")}

/* ---------- Dates (chaînes ISO AAAA-MM-JJ, sans décalage de fuseau) ---------- */
function TODAY(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
const D0=s=>new Date(s+"T12:00:00Z");
function addD(s,n){const d=D0(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function diffD(a,b){return Math.round((D0(b)-D0(a))/864e5)}
function dow(s){return(D0(s).getUTCDay()+6)%7}
function nextM(m){let[y,o]=m.split("-").map(Number);o++;if(o>12){o=1;y++}return y+"-"+String(o).padStart(2,"0")}
function addM(s,k){const d=D0(s),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+k);const dm=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0,12)).getUTCDate();d.setUTCDate(Math.min(day,dm));return d.toISOString().slice(0,10)}
function isoWeek(m){const th=addD(m,3),y=+th.slice(0,4),j=y+"-01-04",m1=addD(j,-dow(j));return[y,Math.floor(diffD(m1,m)/7)+1]}
const MS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."],cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const OPS=()=>D.depenses.filter(o=>/^\d{4}-\d{2}-\d{2}$/.test(o.date||""));

/* ---------- Infobulles (survol à la souris, toucher / glisser au doigt) ---------- */
const TC={r:"#f87171",g:"#2dd4bf",b:"#38bdf8",v:"#a78bfa"};
const tl=(k,v,c)=>`<div class="tl"><span>${k}</span><b${c?` style="color:${c}"`:""}>${v}</b></div>`;
const topCats=(c,n=3)=>Object.entries(c||{}).sort((a,b)=>b[1]-a[1]).slice(0,n);
function tipHtml(title,lines,cats){return`<div class="tt">${esc(title)}</div>${lines.join("")}${cats&&cats.length?`<div class="tc">${cats.map(([k,v])=>`<div class="tl"><span>${esc(k)}</span><span>${eur(v)}</span></div>`).join("")}</div>`:""}`}
const tipEl=document.createElement("div");tipEl.id="tip";document.body.appendChild(tipEl);
let actZ=null;
function hideTip(){tipEl.style.display="none";if(actZ){actZ.classList.remove("act");actZ=null}}
function showTip(z,x,y){if(actZ&&actZ!==z)actZ.classList.remove("act");actZ=z;z.classList.add("act");tipEl.innerHTML=z.getAttribute("data-tip");tipEl.style.display="block";
 const w=tipEl.offsetWidth,h=tipEl.offsetHeight;let l=Math.min(Math.max(8,x-w/2),innerWidth-w-8),t=y-h-22;if(t<8)t=y+26;tipEl.style.left=l+"px";tipEl.style.top=t+"px"}
function zoneAt(x,y){const e=document.elementFromPoint(x,y);return e&&e.closest?e.closest("[data-tip]"):null}
document.addEventListener("pointerdown",e=>{const z=zoneAt(e.clientX,e.clientY);z?showTip(z,e.clientX,e.clientY):hideTip()});
document.addEventListener("pointermove",e=>{const z=zoneAt(e.clientX,e.clientY);z?showTip(z,e.clientX,e.clientY):(actZ&&hideTip())});
document.addEventListener("pointercancel",hideTip);
document.addEventListener("scroll",hideTip,true);

/* ---------- Graphiques SVG génériques ---------- */
let CID=0;
const cw=()=>Math.max(260,(($("#app")||{}).clientWidth||340)-30);
function nTicks(mx){if(!(mx>0))return{top:3,t:[0,1,2,3]};const raw=mx/3,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,s=(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;return{top:s*3,t:[0,s,s*2,s*3]}}
const axl=v=>v>=1000?(+(v/1000).toFixed(1)+"").replace(".",",")+"k€":(+v.toFixed(1)+"").replace(".",",")+"€";
function gridY(tk,Y,W){let yl="",gl="";tk.t.forEach(t=>{const y=Y(t).toFixed(1);yl+=`<text x="34" y="${(Y(t)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#64748b">${axl(t)}</text>`;gl+=`<line x1="0" x2="${W.toFixed(0)}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-dasharray="3 4"/>`});return[yl,gl]}
function barChart(it,o={}){if(!it.length)return'<div class="empty">Aucune donnée</div>';
 const H=150,T=18,B=34,n=it.length,mx=Math.max(...it.map(x=>x.v),o.avg||0,0),tk=nTicks(mx),Y=v=>T+H-v/tk.top*H,avail=Math.max(120,cw()-38),W=Math.max(avail,n*(o.bw||40)),cell=W/n,bwid=Math.min(cell*.72,48),HT=T+H+B;
 const[yl,gl]=gridY(tk,Y,W);let bs="",lb="",zn="";
 it.forEach((x,i)=>{const cx=i*cell+cell/2,h=x.v>0?Math.max(x.v/tk.top*H,1.5):0;
  bs+=`<rect x="${(cx-bwid/2).toFixed(1)}" y="${(T+H-h).toFixed(1)}" width="${bwid.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${x.c||o.col}" fill-opacity=".92"/>`;
  if(o.vals&&x.v>0)bs+=`<text x="${cx.toFixed(1)}" y="${(T+H-h-4).toFixed(1)}" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--txt)">${kfmt(x.v)}</text>`;
  if(x.l1)lb+=`<text x="${cx.toFixed(1)}" y="${T+H+13}" font-size="8.5" text-anchor="middle" fill="#64748b">${esc(x.l1)}</text>`;
  if(x.l2)lb+=`<text x="${cx.toFixed(1)}" y="${T+H+25}" font-size="8" text-anchor="middle" fill="#94a3b8">${esc(x.l2)}</text>`;
  zn+=`<rect class="hz" x="${(i*cell).toFixed(1)}" y="0" width="${cell.toFixed(1)}" height="${HT}"${x.tip?` data-tip="${esc(x.tip)}"`:""}/>`});
 const av=o.avg>0?`<line x1="0" x2="${W.toFixed(0)}" y1="${Y(o.avg).toFixed(1)}" y2="${Y(o.avg).toFixed(1)}" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>`:"";
 return`<div class="ch"><svg class="yax" width="38" height="${HT}">${yl}</svg><div class="sc${W<=avail+1?" fit":""}" data-end="1"><svg width="${W.toFixed(0)}" height="${HT}">${gl}${av}${bs}${lb}${zn}</svg></div></div>${o.lg||""}`}
function areaChart(it,o={}){if(!it.length)return'<div class="empty">Aucune donnée</div>';
 const H=150,T=18,B=26,n=it.length,tk=nTicks(Math.max(...it.map(x=>x.v),0)),Y=v=>T+H-v/tk.top*H,W=Math.max(120,cw()-38),cell=W/n,HT=T+H+B,id="ga"+(++CID),X=i=>(i+.5)*cell;
 const[yl,gl]=gridY(tk,Y,W);let lb="",zn="",dots="";
 const d="M"+it.map((x,i)=>`${X(i).toFixed(1)} ${Y(x.v).toFixed(1)}`).join("L"),st=Math.max(1,Math.ceil(n/5)),idx=[];
 for(let i=0;i<n;i+=st)idx.push(i);if(n-1-idx[idx.length-1]>=st*.6)idx.push(n-1);
 it.forEach((x,i)=>{if(n<=31)dots+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="3" fill="${o.col}"/>`;
  zn+=`<rect class="hz" x="${(i*cell).toFixed(1)}" y="0" width="${cell.toFixed(1)}" height="${HT}"${x.tip?` data-tip="${esc(x.tip)}"`:""}/>`});
 idx.forEach(i=>{const x=Math.min(Math.max(X(i),16),W-16);lb+=`<text x="${x.toFixed(1)}" y="${T+H+15}" font-size="8.5" text-anchor="middle" fill="#64748b">${esc(it[i].l||"")}</text>`});
 return`<div class="ch"><svg class="yax" width="38" height="${HT}">${yl}</svg><div class="sc fit"><svg width="${W.toFixed(0)}" height="${HT}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.col}" stop-opacity=".42"/><stop offset="1" stop-color="${o.col}" stop-opacity="0"/></linearGradient></defs>${gl}<path d="${d}L${X(n-1).toFixed(1)} ${T+H}L${X(0).toFixed(1)} ${T+H}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${o.col}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${lb}${zn}</svg></div></div>`}

/* ---------- Périodes et regroupements (jour / semaine / mois / année) ---------- */
const G=[["jour","Jour"],["semaine","Semaine"],["mois","Mois"],["annee","Année"]],UN={jour:"jour",semaine:"semaine",mois:"mois",annee:"an"},TT={jour:"jour",semaine:"semaine",mois:"mois",annee:"année"},BW={jour:18,semaine:34,mois:44,annee:64},CAP={jour:400,semaine:260,mois:240,annee:60};
function perRange(){const T=TODAY(),L=OPS(),last=L.reduce((m,o)=>o.date>m?o.date:m,""),first=L.reduce((m,o)=>o.date<m?o.date:m,"9999-99-99"),hi=last>T?last:T,ref=last||T;let a,b;
 if(per.startsWith("m:")){const m=per.slice(2);a=m+"-01";b=addD(nextM(m)+"-01",-1)}
 else if(per.startsWith("y:")){const y=per.slice(2);a=y+"-01-01";b=y+"-12-31"}
 else if(per==="all"){a=first==="9999-99-99"?T:first;b=hi}
 else{b=ref;a=addD(addM(ref,-parseInt(per)),1)}
 if(b>hi)b=hi;if(a>b)a=b;return{a,b}}
function mkBuckets(a,b,g){const o=[];
 if(g==="jour")for(let d=a;d<=b;d=addD(d,1))o.push(d);
 else if(g==="semaine")for(let d=addD(a,-dow(a));d<=b;d=addD(d,7))o.push(d);
 else if(g==="mois")for(let m=a.slice(0,7);m<=b.slice(0,7);m=nextM(m))o.push(m);
 else for(let y=+a.slice(0,4);y<=+b.slice(0,4);y++)o.push(""+y);
